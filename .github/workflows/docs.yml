name: Docs Build

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "docs/**"
      - "lava_lyra/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "lava_lyra/**"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        extra: ["discord.py", "py-cord"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-docs-${{ matrix.extra }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[docs,${{ matrix.extra }}]"

    - name: Build docs
      run: sphinx-build -W docs docs/_build/html
